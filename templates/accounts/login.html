{% extends 'base.html' %}{% block title %}Entrar{% endblock %}{% block content %}<section class="panel mx-auto mt-10 max-w-md p-6"><h1 class="text-xl font-bold text-blue-950">Acessar o sistema</h1><p class="mt-1 text-sm text-slate-600">Use suas credenciais institucionais.</p><form method="post" class="mt-6 space-y-4">{% csrf_token %}{{ form.non_field_errors }}<label class="block text-sm font-medium">Usuário{{ form.username }}</label><label class="block text-sm font-medium">Senha{{ form.password }}</label><input type="hidden" name="next" value="{{ next }}"><button class="button-primary w-full justify-center">Entrar</button></form><p class="mt-4 text-xs text-slate-500">Precisa redefinir sua senha? Procure a administração do sistema.</p></section>{% endblock %}
